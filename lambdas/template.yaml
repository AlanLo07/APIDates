AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31

Description: >
  citas-app — Backend serverless mejorado:
  API Gateway HTTP + 4 Lambdas + 3 tablas DynamoDB.
  Optimizado para Free Tier de AWS.

Parameters:
  PlanesTableName:
    Type: String
    Default: Planes
    Description: "Nombre de la tabla Planes ya existente"
  CitasTableName:
    Type: String
    Default: Citas
    Description: "Nombre de la tabla Citas ya existente"
  SpotifyClientId:
    Type: String
    Default: ""
    Description: "Spotify App Client ID"
  SpotifyClientSecret:
    Type: String
    NoEcho: true
    Default: ""
    Description: "Spotify App Client Secret"
  SpotifyMarket:
    Type: String
    Default: CO
    Description: "Market default ISO 3166-1 alpha-2 para Spotify"
  SpotifyRedirectUri:
    Type: String
    Default: ""
    Description: "URL de callback OAuth de Spotify (debe apuntar a /spotify/callback y estar registrada en el dashboard de Spotify)"
  SpotifyStateSecret:
    Type: String
    NoEcho: true
    Default: ""
    Description: "Secreto para firmar el parametro state del flujo OAuth de Spotify (Authorization Code)"
  CognitoCallbackUrl:
    Type: String
    Default: "http://localhost:5173/callback"
    Description: "URL de redirección tras login (Hosted UI). Ajustar en prod."
  CognitoLogoutUrl:
    Type: String
    Default: "http://localhost:5173/"
    Description: "URL de redirección tras logout (Hosted UI). Ajustar en prod."
  RefreshTokenValidityDays:
    Type: Number
    Default: "3650"
    MinValue: "1"
    MaxValue: "3650"
    Description: "Días que dura el refreshToken antes de forzar un nuevo login"
  # KamasutraTableName:
  #   Type: String
  #   Default: KamasutraTable
  #   Description: "Nombre de la tabla Kamasutra"

# ─── Globals ──────────────────────────────────────────────────────────────────
Globals:
  Function:
    Runtime: python3.13
    Timeout: 29
    MemorySize: 128
    Tracing: Active
    Environment:
      Variables:
        TABLE_NAME: !Ref PlanesTableName
        CITAS_TABLE_NAME: !Ref CitasTableName
        LOVE_PHRASES_TABLE_NAME: !Ref LovePhrasesTable
        CHALLENGES_TABLE_NAME: !Ref ChallengesTable
        DICE_TABLE_NAME: !Ref DiceTable
        KAMASUTRA_TABLE_NAME: !Ref KamasutraTable
        BODAS_TABLE_NAME: !Ref BodasTable
        FINANCES_TABLE_NAME: !Ref FinancesTable
        CHECKLISTS_TABLE_NAME: !Ref ChecklistsTable
        POWERTOOLS_LOG_LEVEL: INFO
    Layers:
      - !Ref CommonLayer

# ─── Recursos ──────────────────────────────────────────────────────────────────
Resources:
# ── S3 Bucket para Imágenes ────────────────────────────────────────────────
  ImagesBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "${AWS::StackName}-images-${AWS::AccountId}"
      PublicAccessBlockConfiguration:
        BlockPublicAcls: false
        BlockPublicPolicy: false
        IgnorePublicAcls: false
        RestrictPublicBuckets: false
      CorsConfiguration:
        CorsRules:
          - AllowedHeaders: ["*"]
            AllowedMethods: ["GET", "PUT", "POST"]
            AllowedOrigins: ["*"] # En producción, limita esto a tu dominio
  # ── Política para permitir lectura pública (ReadOnly) ──────────────────────
  ImagesBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref ImagesBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: PublicReadGetObject
            Effect: Allow
            Principal: "*" # Permite a cualquier persona
            Action: "s3:GetObject"
            Resource: !Sub "arn:aws:s3:::${ImagesBucket}/*" # Aplica a todos los objetos dentro
  # ── Lambda: Image Management ──────────────────────────────────────────────
  ImagesFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: images-manager
      CodeUri: functions/ImagesManager/
      Handler: handler.lambda_handler
      Description: "Genera URLs para subir y gestionar imágenes en S3"
      Environment:
        Variables:
          BUCKET_NAME: !Ref ImagesBucket
      Policies:
        - S3WritePolicy:
            BucketName: !Ref ImagesBucket
        - S3ReadPolicy:
            BucketName: !Ref ImagesBucket
      Events:
        GetUploadUrl:
          Type: HttpApi
          Properties:
            ApiId: !Ref CitasApi
            Method: POST
            Path: /images/upload-url
        GetAudioUploadUrl:
          Type: HttpApi
          Properties:
            ApiId: !Ref CitasApi
            Method: POST
            Path: /audio/upload-url
        GetHomeMascotImages:
          Type: HttpApi
          Properties:
            ApiId: !Ref CitasApi
            Method: GET
            Path: /images/home-mascot-images
  # ── Capa compartida (utils.py) ─────────────────────────────────────────────
  CommonLayer:
    Type: AWS::Serverless::LayerVersion
    Properties:
      LayerName: citas-common
      ContentUri: layers/baselayer/
      CompatibleRuntimes:
        - python3.13
      RetentionPolicy: Delete

  # ── API Gateway HTTP API ───────────────────────────────────────────────────
# ── Cognito: User Pool (directorio de usuarios) ─────────────────────────────
  CognitoUserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: !Sub "${AWS::StackName}-user-pool"
      UsernameAttributes:
        - email
      AutoVerifiedAttributes:
        - email
      Schema:
        - Name: email
          AttributeDataType: String
          Required: true
          Mutable: true
        - Name: name
          AttributeDataType: String
          Required: false
          Mutable: true
      Policies:
        PasswordPolicy:
          MinimumLength: 8
          RequireLowercase: true
          RequireUppercase: true
          RequireNumbers: true
          RequireSymbols: false
      AccountRecoverySetting:
        RecoveryMechanisms:
          - Name: verified_email
            Priority: 1
      AdminCreateUserConfig:
        AllowAdminCreateUserOnly: false

  # ── Cognito: App Client (usado por el front / lambdas de auth) ─────────────
  CognitoUserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      ClientName: !Sub "${AWS::StackName}-web-client"
      UserPoolId: !Ref CognitoUserPool
      GenerateSecret: false
      ExplicitAuthFlows:
        - ALLOW_USER_PASSWORD_AUTH
        - ALLOW_USER_SRP_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH
      AccessTokenValidity: 60
      IdTokenValidity: 60
      RefreshTokenValidity: !Ref RefreshTokenValidityDays
      TokenValidityUnits:
        AccessToken: minutes
        IdToken: minutes
        RefreshToken: days
      SupportedIdentityProviders:
        - COGNITO
      AllowedOAuthFlows:
        - code
      AllowedOAuthScopes:
        - openid
        - email
        - profile
      AllowedOAuthFlowsUserPoolClient: true
      CallbackURLs:
        - !Ref CognitoCallbackUrl
      LogoutURLs:
        - !Ref CognitoLogoutUrl

  # ── Cognito: Dominio para Hosted UI (login/registro alojado por AWS) ───────
  CognitoUserPoolDomain:
    Type: AWS::Cognito::UserPoolDomain
    Properties:
      Domain: !Sub "${AWS::StackName}-auth-${AWS::AccountId}"
      UserPoolId: !Ref CognitoUserPool

  CitasApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      CorsConfiguration:
        AllowOrigins:
          - "*"
        AllowMethods:
          - GET
          - POST
          - PUT
          - DELETE
          - PATCH
          - OPTIONS
        AllowHeaders:
          - Content-Type
          - X-Api-Key
          - Authorization
      Auth:
        Authorizers:
          CognitoJwtAuthorizer:
            JwtConfiguration:
              issuer: !Sub "https://cognito-idp.${AWS::Region}.amazonaws.com/${CognitoUserPool}"
              audience:
                - !Ref CognitoUserPoolClient
            IdentitySource: "$request.header.Authorization"
        DefaultAuthorizer: CognitoJwtAuthorizer
        # Todas las rutas quedan protegidas por defecto. Las rutas de pre-login
        # (signup/confirm/login/refresh/forgot-password) se abren explícitamente
        # con Auth: { Authorizer: NONE } en su propio evento HttpApi.

  # ── Lambda: Auth (signup/login/confirm/refresh/forgot-password) ───────────
  AuthFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: auth-crud
      CodeUri: functions/AuthCRUD/
      Handler: handler.lambda_handler
      Description: "Autenticación de usuarios contra Cognito User Pool"
      Environment:
        Variables:
          COGNITO_USER_POOL_ID: !Ref CognitoUserPool
          COGNITO_CLIENT_ID: !Ref CognitoUserPoolClient
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - cognito-idp:SignUp
                - cognito-idp:ConfirmSignUp
                - cognito-idp:ResendConfirmationCode
                - cognito-idp:InitiateAuth
                - cognito-idp:ForgotPassword
                - cognito-idp:ConfirmForgotPassword
                - cognito-idp:GlobalSignOut
              Resource: !GetAtt CognitoUserPool.Arn
      Events:
        SignUp:
          Type: HttpApi
          Properties:
            ApiId: !Ref CitasApi
            Method: POST
            Path: /auth/signup
            Auth:
              Authorizer: NONE
        Confirm:
          Type: HttpApi
          Properties:
            ApiId: !Ref CitasApi
            Method: POST
            Path: /auth/confirm
            Auth:
              Authorizer: NONE
        ResendCode:
          Type: HttpApi
          Properties:
            ApiId: !Ref CitasApi
            Method: POST
            Path: /auth/resend-code
            Auth:
              Authorizer: NONE
        Login:
          Type: HttpApi
          Properties:
            ApiId: !Ref CitasApi
            Method: POST
            Path: /auth/login
            Auth:
              Authorizer: NONE
        Refresh:
          Type: HttpApi
          Properties:
            ApiId: !Ref CitasApi
            Method: POST
            Path: /auth/refresh
            Auth:
              Authorizer: NONE
        ForgotPassword:
          Type: HttpApi
          Properties:
            ApiId: !Ref CitasApi
            Method: POST
            Path: /auth/forgot-password
            Auth:
              Authorizer: NONE
        ConfirmForgotPassword:
          Type: HttpApi
          Properties:
            ApiId: !Ref CitasApi
            Method: POST
            Path: /auth/confirm-forgot-password
            Auth:
              Authorizer: NONE
        Logout:
          Type: HttpApi
          Properties:
            ApiId: !Ref CitasApi
            Method: POST
            Path: /auth/logout
        Me:
          Type: HttpApi
          Properties:
            ApiId: !Ref CitasApi
            Method: GET
            Path: /auth/me

  # ── Lambda: Planes CRUD ────────────────────────────────────────────────────
  PlanesFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: planes-crud
      CodeUri: functions/DatesCRUD/
      Handler: handler.lambda_handler
      Description: "CRUD de Planes turísticos/actividades"
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref PlanesTableName
      Events:
        GetAll:
          Type: HttpApi
          Properties:
            ApiId: !Ref CitasApi
            Method: GET
            Path: /planes
        GetOne:
          Type: HttpApi
          Properties:
            ApiId: !Ref CitasApi
            Method: GET
            Path: /planes/{nombre}
        Create:
          Type: HttpApi
          Properties:
            ApiId: !Ref CitasApi
            Method: POST
            Path: /planes
        Update:
          Type: HttpApi
          Properties:
            ApiId: !Ref CitasApi
            Method: PUT
            Path: /planes/{nombre}
        Delete:
          Type: HttpApi
          Properties:
            ApiId: !Ref CitasApi
            Method: DELETE
            Path: /planes/{nombre}
        ResetRatings:
          Type: HttpApi
          Properties:
            ApiId: !Ref CitasApi
            Method: PATCH
            Path: /planes/reset-ratings

  # ── Lambda: Citas CRUD ─────────────────────────────────────────────────────
  CitasFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: citas-crud
      CodeUri: functions/CitasCRUD/
      Handler: handler.lambda_handler
      Description: "CRUD de Citas (agenda de actividades)"
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref CitasTableName
      Events:
        GetAll:
          Type: HttpApi
          Properties:
            ApiId: !Ref CitasApi
            Method: GET
            Path: /citas
        GetOne:
          Type: HttpApi
          Properties:
            ApiId: !Ref CitasApi
            Method: GET
            Path: /citas/{id}
        Create:
          Type: HttpApi
          Properties:
            ApiId: !Ref CitasApi
            Method: POST
            Path: /citas
        Update:
          Type: HttpApi
          Properties:
            ApiId: !Ref CitasApi
            Method: PUT
            Path: /citas/{id}
        Delete:
          Type: HttpApi
          Properties:
            ApiId: !Ref CitasApi
            Method: DELETE
            Path: /citas/{id}
        Open:
          Type: HttpApi
          Properties:
            ApiId: !Ref CitasApi
            Method: PATCH
            Path: /citas/{id}/abrir
        GetCancionesSemana:
          Type: HttpApi
          Properties:
            ApiId: !Ref CitasApi
            Method: GET
            Path: /citas/cancion-semana
        GetCancionSemanaActual:
          Type: HttpApi
          Properties:
            ApiId: !Ref CitasApi
            Method: GET
            Path: /citas/cancion-semana/current
        CreateCancionSemana:
          Type: HttpApi
          Properties:
            ApiId: !Ref CitasApi
            Method: POST
            Path: /citas/cancion-semana

  # ── Lambda: Random Plan ────────────────────────────────────────────────────
  RandomPlanFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: random-plan
      CodeUri: functions/RandomDates/
      Handler: handler.lambda_handler
      Description: "Genera un Plan aleatorio y una Cita sugerida"
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref PlanesTableName
        - DynamoDBCrudPolicy:
            TableName: !Ref CitasTableName
      Events:
        GetRandom:
          Type: HttpApi
          Properties:
            ApiId: !Ref CitasApi
            Method: POST
            Path: /planes/_random

  # ── Lambda: Love Phrases CRUD ──────────────────────────────────────────────
  LovePhrasesFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: love-phrases-crud
      CodeUri: functions/PhrasesCRUD/
      Handler: handler.lambda_handler
      Description: "CRUD de Frases de Amor para el juego del ahorcado"
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref LovePhrasesTable
      Events:
        GetAll:
          Type: HttpApi
          Properties:
            ApiId: !Ref CitasApi
            Method: GET
            Path: /love-phrases
        GetRandom:
          Type: HttpApi
          Properties:
            ApiId: !Ref CitasApi
            Method: GET
            Path: /love-phrases/random
        GetOne:
          Type: HttpApi
          Properties:
            ApiId: !Ref CitasApi
            Method: GET
            Path: /love-phrases/{id}
        Create:
          Type: HttpApi
          Properties:
            ApiId: !Ref CitasApi
            Method: POST
            Path: /love-phrases
        Update:
          Type: HttpApi
          Properties:
            ApiId: !Ref CitasApi
            Method: PUT
            Path: /love-phrases/{id}
        Delete:
          Type: HttpApi
          Properties:
            ApiId: !Ref CitasApi
            Method: DELETE
            Path: /love-phrases/{id}

  # ── Lambda: Bodas CRUD ────────────────────────────────────────────────────
  BodasFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: bodas-crud
      CodeUri: functions/BodasCRUD/
      Handler: handler.lambda_handler
      Description: "CRUD de bodas, invitados, itinerario y logística"
      Environment:
        Variables:
          BUCKET_NAME: !Ref ImagesBucket
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref BodasTable
        - S3WritePolicy:
            BucketName: !Ref ImagesBucket
        - S3ReadPolicy:
            BucketName: !Ref ImagesBucket
      Events:
        ListBodas:
          Type: HttpApi
          Properties:
            ApiId: !Ref CitasApi
            Method: GET
            Path: /bodas
        CreateBoda:
          Type: HttpApi
          Properties:
            ApiId: !Ref CitasApi
            Method: POST
            Path: /bodas
        GetBoda:
          Type: HttpApi
          Properties:
            ApiId: !Ref CitasApi
            Method: GET
            Path: /bodas/{bodaId}
        UpdateBoda:
          Type: HttpApi
          Properties:
            ApiId: !Ref CitasApi
            Method: PUT
            Path: /bodas/{bodaId}
        DeleteBoda:
          Type: HttpApi
          Properties:
            ApiId: !Ref CitasApi
            Method: DELETE
            Path: /bodas/{bodaId}
        PublicBoda:
          Type: HttpApi
          Properties:
            ApiId: !Ref CitasApi
            Method: GET
            Path: /bodas/{bodaId}/public
        ListCollection:
          Type: HttpApi
          Properties:
            ApiId: !Ref CitasApi
            Method: GET
            Path: /bodas/{bodaId}/{collection}
        CreateCollection:
          Type: HttpApi
          Properties:
            ApiId: !Ref CitasApi
            Method: POST
            Path: /bodas/{bodaId}/{collection}
        CreateAlbumUploadUrl:
          Type: HttpApi
          Properties:
            ApiId: !Ref CitasApi
            Method: POST
            Path: /bodas/{bodaId}/{collection}/upload-url
        GetCollectionItem:
          Type: HttpApi
          Properties:
            ApiId: !Ref CitasApi
            Method: GET
            Path: /bodas/{bodaId}/{collection}/{itemId}
        UpdateCollectionItem:
          Type: HttpApi
          Properties:
            ApiId: !Ref CitasApi
            Method: PUT
            Path: /bodas/{bodaId}/{collection}/{itemId}
        DeleteCollectionItem:
          Type: HttpApi
          Properties:
            ApiId: !Ref CitasApi
            Method: DELETE
            Path: /bodas/{bodaId}/{collection}/{itemId}
        UpdateInvitadoRsvp:
          Type: HttpApi
          Properties:
            ApiId: !Ref CitasApi
            Method: PATCH
            Path: /bodas/{bodaId}/invitados/{itemId}/rsvp

  # ── DynamoDB: Tabla Love Phrases ───────────────────────────────────────────
  LovePhrasesTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: LovePhrases
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
        - AttributeName: type
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH
      # GSI para filtrar por tipo (cancion, pelicula, libro, serie, pareja)
      GlobalSecondaryIndexes:
        - IndexName: type-index
          KeySchema:
            - AttributeName: type
              KeyType: HASH
          Projection:
            ProjectionType: ALL
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      SSESpecification:
        SSEEnabled: true
      Tags:
        - Key: Project
          Value: citas-app

  # ── Lambda: Kamasutra CRUD ─────────────────────────────────────────────────
  KamasutraFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: kamasutra-crud
      CodeUri: functions/KamasutraCRUD/
      Handler: handler.lambda_handler
      Description: "CRUD de posiciones de Kamasutra con niveles"
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref KamasutraTable
      Events:
        GetAll:
          Type: HttpApi
          Properties:
            ApiId: !Ref CitasApi
            Method: GET
            Path: /kamasutra
        GetRandom:
          Type: HttpApi
          Properties:
            ApiId: !Ref CitasApi
            Method: GET
            Path: /kamasutra/random
        GetOne:
          Type: HttpApi
          Properties:
            ApiId: !Ref CitasApi
            Method: GET
            Path: /kamasutra/{id}
        Create:
          Type: HttpApi
          Properties:
            ApiId: !Ref CitasApi
            Method: POST
            Path: /kamasutra
        Update:
          Type: HttpApi
          Properties:
            ApiId: !Ref CitasApi
            Method: PUT
            Path: /kamasutra/{id}
        Delete:
          Type: HttpApi
          Properties:
            ApiId: !Ref CitasApi
            Method: DELETE
            Path: /kamasutra/{id}

  # ── Lambda: Challenges CRUD ──────────────────────────────────────────────
  ChallengesFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: challenges-crud
      CodeUri: functions/ChallengesCRUD/
      Handler: handler.lambda_handler
      Description: "CRUD de Retos/Challenges con niveles (suave, picante, atrevido)"
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref ChallengesTable
      Events:
        GetAll:
          Type: HttpApi
          Properties:
            ApiId: !Ref CitasApi
            Method: GET
            Path: /challenges
        GetRandom:
          Type: HttpApi
          Properties:
            ApiId: !Ref CitasApi
            Method: GET
            Path: /challenges/random
        GetOne:
          Type: HttpApi
          Properties:
            ApiId: !Ref CitasApi
            Method: GET
            Path: /challenges/{id}
        Create:
          Type: HttpApi
          Properties:
            ApiId: !Ref CitasApi
            Method: POST
            Path: /challenges
        Update:
          Type: HttpApi
          Properties:
            ApiId: !Ref CitasApi
            Method: PUT
            Path: /challenges/{id}
        Delete:
          Type: HttpApi
          Properties:
            ApiId: !Ref CitasApi
            Method: DELETE
            Path: /challenges/{id}

  # ── Lambda: Dice CRUD (Acciones, Zonas, Modificadores) ──────────────────────
  DiceFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: dice-crud
      CodeUri: functions/DiceCRUD/
      Handler: handler.lambda_handler
      Description: "CRUD de Dados (acciones, zonas, modificadores) con niveles"
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref DiceTable
      Events:
        GetAll:
          Type: HttpApi
          Properties:
            ApiId: !Ref CitasApi
            Method: GET
            Path: /dice
        GetRandom:
          Type: HttpApi
          Properties:
            ApiId: !Ref CitasApi
            Method: GET
            Path: /dice/random
        GetOne:
          Type: HttpApi
          Properties:
            ApiId: !Ref CitasApi
            Method: GET
            Path: /dice/{id}
        Create:
          Type: HttpApi
          Properties:
            ApiId: !Ref CitasApi
            Method: POST
            Path: /dice
        Update:
          Type: HttpApi
          Properties:
            ApiId: !Ref CitasApi
            Method: PUT
            Path: /dice/{id}
        Delete:
          Type: HttpApi
          Properties:
            ApiId: !Ref CitasApi
            Method: DELETE
            Path: /dice/{id}

  # ── DynamoDB: Tabla Kamasutra ──────────────────────────────────────────────
  KamasutraTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: KamasutraTable
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
        - AttributeName: level
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH
      # GSI para filtrar eficientemente por nivel sin scan completo
      GlobalSecondaryIndexes:
        - IndexName: level-index
          KeySchema:
            - AttributeName: level
              KeyType: HASH
          Projection:
            ProjectionType: ALL
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      SSESpecification:
        SSEEnabled: true
      Tags:
        - Key: Project
          Value: citas-app

  # ── DynamoDB: Tabla Challenges ────────────────────────────────────────────
  ChallengesTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: ChallengesTable
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
        - AttributeName: level
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH
      # GSI para filtrar eficientemente por nivel sin scan completo
      GlobalSecondaryIndexes:
        - IndexName: level-index
          KeySchema:
            - AttributeName: level
              KeyType: HASH
          Projection:
            ProjectionType: ALL
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      SSESpecification:
        SSEEnabled: true
      Tags:
        - Key: Project
          Value: citas-app

  # ── DynamoDB: Tabla Dice ─────────────────────────────────────────────────
  DiceTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: DiceTable
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
        - AttributeName: level
          AttributeType: S
        - AttributeName: diceType
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH
      # GSI para filtrar por nivel
      GlobalSecondaryIndexes:
        - IndexName: level-index
          KeySchema:
            - AttributeName: level
              KeyType: HASH
          Projection:
            ProjectionType: ALL
        # GSI para filtrar por tipo de dado
        - IndexName: diceType-index
          KeySchema:
            - AttributeName: diceType
              KeyType: HASH
          Projection:
            ProjectionType: ALL
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      SSESpecification:
        SSEEnabled: true
      Tags:
        - Key: Project
          Value: citas-app

  # ── Lambda: Finances CRUD ─────────────────────────────────────────────────
  FinancesFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: finances-crud
      CodeUri: functions/FinancesCRUD/
      Handler: handler.lambda_handler
      Description: "CRUD de Finanzas de una Pareja con presupuestos y históricos"
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref FinancesTable
      Events:
        InitCouple:
          Type: HttpApi
          Properties:
            ApiId: !Ref CitasApi
            Method: POST
            Path: /finances/init
        GetCouple:
          Type: HttpApi
          Properties:
            ApiId: !Ref CitasApi
            Method: GET
            Path: /finances
        GetSummary:
          Type: HttpApi
          Properties:
            ApiId: !Ref CitasApi
            Method: GET
            Path: /finances/resumen
        ListExpenses:
          Type: HttpApi
          Properties:
            ApiId: !Ref CitasApi
            Method: GET
            Path: /finances/gastos
        CreateExpense:
          Type: HttpApi
          Properties:
            ApiId: !Ref CitasApi
            Method: POST
            Path: /finances/gastos
        GetExpense:
          Type: HttpApi
          Properties:
            ApiId: !Ref CitasApi
            Method: GET
            Path: /finances/gastos/{gastoId}
        UpdateExpense:
          Type: HttpApi
          Properties:
            ApiId: !Ref CitasApi
            Method: PUT
            Path: /finances/gastos/{gastoId}
        DeleteExpense:
          Type: HttpApi
          Properties:
            ApiId: !Ref CitasApi
            Method: DELETE
            Path: /finances/gastos/{gastoId}
        SetBudget:
          Type: HttpApi
          Properties:
            ApiId: !Ref CitasApi
            Method: POST
            Path: /finances/presupuesto/{monthYear}
        GetBudget:
          Type: HttpApi
          Properties:
            ApiId: !Ref CitasApi
            Method: GET
            Path: /finances/presupuesto/{monthYear}
        GetMonthlyHistory:
          Type: HttpApi
          Properties:
            ApiId: !Ref CitasApi
            Method: GET
            Path: /finances/historico/{monthYear}
        GetAllHistory:
          Type: HttpApi
          Properties:
            ApiId: !Ref CitasApi
            Method: GET
            Path: /finances/historico

  # ── Lambda: Checklists CRUD ────────────────────────────────────────────────
  ChecklistsFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: checklists-crud
      CodeUri: functions/ChecklistsCRUD/
      Handler: handler.lambda_handler
      Description: "CRUD de checklists (supermercado, viaje, deseos y personalizados) con grupos e items"
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref ChecklistsTable
      Events:
        ListChecklists:
          Type: HttpApi
          Properties:
            ApiId: !Ref CitasApi
            Method: GET
            Path: /checklists
        CreateChecklist:
          Type: HttpApi
          Properties:
            ApiId: !Ref CitasApi
            Method: POST
            Path: /checklists
        SeedDefaultChecklists:
          Type: HttpApi
          Properties:
            ApiId: !Ref CitasApi
            Method: POST
            Path: /checklists/seed-defaults
        GetChecklist:
          Type: HttpApi
          Properties:
            ApiId: !Ref CitasApi
            Method: GET
            Path: /checklists/{checklistId}
        UpdateChecklist:
          Type: HttpApi
          Properties:
            ApiId: !Ref CitasApi
            Method: PUT
            Path: /checklists/{checklistId}
        DeleteChecklist:
          Type: HttpApi
          Properties:
            ApiId: !Ref CitasApi
            Method: DELETE
            Path: /checklists/{checklistId}
        ResetChecklist:
          Type: HttpApi
          Properties:
            ApiId: !Ref CitasApi
            Method: PATCH
            Path: /checklists/{checklistId}/reset
        ListCollection:
          Type: HttpApi
          Properties:
            ApiId: !Ref CitasApi
            Method: GET
            Path: /checklists/{checklistId}/{collection}
        CreateCollectionItem:
          Type: HttpApi
          Properties:
            ApiId: !Ref CitasApi
            Method: POST
            Path: /checklists/{checklistId}/{collection}
        GetCollectionItem:
          Type: HttpApi
          Properties:
            ApiId: !Ref CitasApi
            Method: GET
            Path: /checklists/{checklistId}/{collection}/{itemId}
        UpdateCollectionItem:
          Type: HttpApi
          Properties:
            ApiId: !Ref CitasApi
            Method: PUT
            Path: /checklists/{checklistId}/{collection}/{itemId}
        DeleteCollectionItem:
          Type: HttpApi
          Properties:
            ApiId: !Ref CitasApi
            Method: DELETE
            Path: /checklists/{checklistId}/{collection}/{itemId}
        UpdateItemComprado:
          Type: HttpApi
          Properties:
            ApiId: !Ref CitasApi
            Method: PATCH
            Path: /checklists/{checklistId}/items/{itemId}/comprado

  # ── Lambda: Spotify API (catalogo + player con vinculacion de usuario) ────
  SpotifyFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: spotify-api
      CodeUri: functions/SpotifyAPI/
      Handler: handler.lambda_handler
      Description: "Endpoints de Spotify: catalogo (search/tracks/artists/albums/playlists) y player"
      Environment:
        Variables:
          SPOTIFY_CLIENT_ID: !Ref SpotifyClientId
          SPOTIFY_CLIENT_SECRET: !Ref SpotifyClientSecret
          SPOTIFY_MARKET: !Ref SpotifyMarket
          SPOTIFY_REDIRECT_URI: !Ref SpotifyRedirectUri
          SPOTIFY_STATE_SECRET: !Ref SpotifyStateSecret
          SPOTIFY_TOKENS_TABLE: !Ref SpotifyTokensTable
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref SpotifyTokensTable
      Events:
        SpotifySearch:
          Type: HttpApi
          Properties:
            ApiId: !Ref CitasApi
            Method: GET
            Path: /spotify/search
        SpotifyGetTrack:
          Type: HttpApi
          Properties:
            ApiId: !Ref CitasApi
            Method: GET
            Path: /spotify/tracks/{id}
        SpotifyGetArtist:
          Type: HttpApi
          Properties:
            ApiId: !Ref CitasApi
            Method: GET
            Path: /spotify/artists/{id}
        SpotifyGetArtistTopTracks:
          Type: HttpApi
          Properties:
            ApiId: !Ref CitasApi
            Method: GET
            Path: /spotify/artists/{id}/top-tracks
        SpotifyGetArtistAlbums:
          Type: HttpApi
          Properties:
            ApiId: !Ref CitasApi
            Method: GET
            Path: /spotify/artists/{id}/albums
        SpotifyGetAlbum:
          Type: HttpApi
          Properties:
            ApiId: !Ref CitasApi
            Method: GET
            Path: /spotify/albums/{id}
        SpotifyGetAlbumTracks:
          Type: HttpApi
          Properties:
            ApiId: !Ref CitasApi
            Method: GET
            Path: /spotify/albums/{id}/tracks
        SpotifyGetPlaylist:
          Type: HttpApi
          Properties:
            ApiId: !Ref CitasApi
            Method: GET
            Path: /spotify/playlists/{id}
        SpotifyGetPlaylistTracks:
          Type: HttpApi
          Properties:
            ApiId: !Ref CitasApi
            Method: GET
            Path: /spotify/playlists/{id}/tracks
        SpotifyLogin:
          Type: HttpApi
          Properties:
            ApiId: !Ref CitasApi
            Method: GET
            Path: /spotify/login
        SpotifyCallback:
          Type: HttpApi
          Properties:
            ApiId: !Ref CitasApi
            Method: GET
            Path: /spotify/callback
            Auth:
              Authorizer: NONE
        SpotifyPlayerState:
          Type: HttpApi
          Properties:
            ApiId: !Ref CitasApi
            Method: GET
            Path: /spotify/player
        SpotifyPlayerCurrentlyPlaying:
          Type: HttpApi
          Properties:
            ApiId: !Ref CitasApi
            Method: GET
            Path: /spotify/player/currently-playing
        SpotifyPlayerDevices:
          Type: HttpApi
          Properties:
            ApiId: !Ref CitasApi
            Method: GET
            Path: /spotify/player/devices
        SpotifyPlayerPlay:
          Type: HttpApi
          Properties:
            ApiId: !Ref CitasApi
            Method: PUT
            Path: /spotify/player/play
        SpotifyPlayerPause:
          Type: HttpApi
          Properties:
            ApiId: !Ref CitasApi
            Method: PUT
            Path: /spotify/player/pause
        SpotifyPlayerVolume:
          Type: HttpApi
          Properties:
            ApiId: !Ref CitasApi
            Method: PUT
            Path: /spotify/player/volume
        SpotifyPlayerNext:
          Type: HttpApi
          Properties:
            ApiId: !Ref CitasApi
            Method: POST
            Path: /spotify/player/next
        SpotifyPlayerPrevious:
          Type: HttpApi
          Properties:
            ApiId: !Ref CitasApi
            Method: POST
            Path: /spotify/player/previous

  # ── DynamoDB: Tokens de usuario vinculados a Spotify (Authorization Code) ─
  SpotifyTokensTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: SpotifyUserTokens
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: userId
          AttributeType: S
      KeySchema:
        - AttributeName: userId
          KeyType: HASH


  # ── DynamoDB: Tabla Bodas (agregado completo) ────────────────────────────
  BodasTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: BodasTable
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
        - AttributeName: sk
          AttributeType: S
        - AttributeName: entityType
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
        - AttributeName: sk
          KeyType: RANGE
      GlobalSecondaryIndexes:
        - IndexName: entityType-index
          KeySchema:
            - AttributeName: entityType
              KeyType: HASH
            - AttributeName: sk
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      SSESpecification:
        SSEEnabled: true
      Tags:
        - Key: Project
          Value: citas-app

  # ── DynamoDB: Tabla Finances (PK/SK compuesta) ─────────────────────────────
  FinancesTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: FinancesTable
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
        - AttributeName: SK
          AttributeType: S
        - AttributeName: monthYear
          AttributeType: S
        - AttributeName: category
          AttributeType: S
      KeySchema:
        - AttributeName: PK
          KeyType: HASH
        - AttributeName: SK
          KeyType: RANGE
      # GSI para búsquedas por mes (análisis histórico)
      GlobalSecondaryIndexes:
        - IndexName: monthYear-index
          KeySchema:
            - AttributeName: PK
              KeyType: HASH
            - AttributeName: monthYear
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
        # GSI para búsquedas por categoría
        - IndexName: category-index
          KeySchema:
            - AttributeName: PK
              KeyType: HASH
            - AttributeName: category
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      SSESpecification:
        SSEEnabled: true
      Tags:
        - Key: Project
          Value: citas-app

  # ── DynamoDB: Tabla Checklists (agregado completo) ───────────────────────
  ChecklistsTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: ChecklistsTable
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
        - AttributeName: sk
          AttributeType: S
        - AttributeName: entityType
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
        - AttributeName: sk
          KeyType: RANGE
      GlobalSecondaryIndexes:
        - IndexName: entityType-index
          KeySchema:
            - AttributeName: entityType
              KeyType: HASH
            - AttributeName: sk
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      SSESpecification:
        SSEEnabled: true
      Tags:
        - Key: Project
          Value: citas-app

# ─── Outputs ──────────────────────────────────────────────────────────────────
Outputs:
  ApiUrl:
    Description: "URL base de la API"
    Value: !Sub "https://${CitasApi}.execute-api.${AWS::Region}.amazonaws.com"
    Export:
      Name: !Sub "CitasApiUrl"

  CognitoUserPoolId:
    Description: "ID del User Pool de Cognito"
    Value: !Ref CognitoUserPool
    Export:
      Name: !Sub "${AWS::StackName}-CognitoUserPoolId"

  CognitoUserPoolClientId:
    Description: "ID del App Client de Cognito (usar en el front)"
    Value: !Ref CognitoUserPoolClient
    Export:
      Name: !Sub "${AWS::StackName}-CognitoUserPoolClientId"

  CognitoHostedUiDomain:
    Description: "Dominio de la Hosted UI de Cognito para login/registro"
    Value: !Sub "https://${CognitoUserPoolDomain}.auth.${AWS::Region}.amazoncognito.com"

  CognitoIssuerUrl:
    Description: "Issuer URL usado para validar JWTs"
    Value: !Sub "https://cognito-idp.${AWS::Region}.amazonaws.com/${CognitoUserPool}"

  AuthEndpoint:
    Description: "Endpoint base de autenticación"
    Value: !Sub "https://${CitasApi}.execute-api.${AWS::Region}.amazonaws.com/auth"

  LovePhrasesTableName:
    Description: "Nombre de la tabla LovePhrases"
    Value: !Ref LovePhrasesTable

  LovePhrasesEndpoint:
    Description: "Endpoint de Love Phrases"
    Value: !Sub "https://${CitasApi}.execute-api.${AWS::Region}.amazonaws.com/love-phrases"
  
  KamasutraEndpoint:
    Description: "Endpoint de Kamasutra"
    Value: !Sub "https://${CitasApi}.execute-api.${AWS::Region}.amazonaws.com/kamasutra"

  ChallengesTableName:
    Description: "Nombre de la tabla Challenges"
    Value: !Ref ChallengesTable

  ChallengesEndpoint:
    Description: "Endpoint de Challenges"
    Value: !Sub "https://${CitasApi}.execute-api.${AWS::Region}.amazonaws.com/challenges"

  DiceTableName:
    Description: "Nombre de la tabla Dice"
    Value: !Ref DiceTable

  DiceEndpoint:
    Description: "Endpoint de Dice"
    Value: !Sub "https://${CitasApi}.execute-api.${AWS::Region}.amazonaws.com/dice"

  BodasTableName:
    Description: "Nombre de la tabla Bodas"
    Value: !Ref BodasTable

  BodasEndpoint:
    Description: "Endpoint base de Bodas"
    Value: !Sub "https://${CitasApi}.execute-api.${AWS::Region}.amazonaws.com/bodas"

  FinancesTableName:
    Description: "Nombre de la tabla Finances"
    Value: !Ref FinancesTable

  FinancesEndpoint:
    Description: "Endpoint base de Finanzas de Parejas"
    Value: !Sub "https://${CitasApi}.execute-api.${AWS::Region}.amazonaws.com/finances"

  SpotifyEndpoint:
    Description: "Endpoint base de Spotify"
    Value: !Sub "https://${CitasApi}.execute-api.${AWS::Region}.amazonaws.com/spotify"

  ChecklistsTableName:
    Description: "Nombre de la tabla Checklists"
    Value: !Ref ChecklistsTable

  ChecklistsEndpoint:
    Description: "Endpoint base de Checklists"
    Value: !Sub "https://${CitasApi}.execute-api.${AWS::Region}.amazonaws.com/checklists"
