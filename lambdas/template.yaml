AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31

Description: >
  citas-app — Backend serverless mejorado:
  API Gateway HTTP + 4 Lambdas + 3 tablas DynamoDB.
  Optimizado para Free Tier de AWS.

Parameters:
  PlanesTableName:
    Type: String
    Default: Planes
    Description: "Nombre de la tabla Planes ya existente"
  CitasTableName:
    Type: String
    Default: Citas
    Description: "Nombre de la tabla Citas ya existente"
  SpotifyClientId:
    Type: String
    Default: ""
    Description: "Spotify App Client ID"
  SpotifyClientSecret:
    Type: String
    NoEcho: true
    Default: ""
    Description: "Spotify App Client Secret"
  SpotifyMarket:
    Type: String
    Default: CO
    Description: "Market default ISO 3166-1 alpha-2 para Spotify"
  # KamasutraTableName:
  #   Type: String
  #   Default: KamasutraTable
  #   Description: "Nombre de la tabla Kamasutra"

# ─── Globals ──────────────────────────────────────────────────────────────────
Globals:
  Function:
    Runtime: python3.13
    Timeout: 29
    MemorySize: 128
    Tracing: Active
    Environment:
      Variables:
        TABLE_NAME: !Ref PlanesTableName
        CITAS_TABLE_NAME: !Ref CitasTableName
        LOVE_PHRASES_TABLE_NAME: !Ref LovePhrasesTable
        CHALLENGES_TABLE_NAME: !Ref ChallengesTable
        DICE_TABLE_NAME: !Ref DiceTable
        KAMASUTRA_TABLE_NAME: !Ref KamasutraTable
        BODAS_TABLE_NAME: !Ref BodasTable
        FINANCES_TABLE_NAME: !Ref FinancesTable
        CHECKLISTS_TABLE_NAME: !Ref ChecklistsTable
        POWERTOOLS_LOG_LEVEL: INFO
    Layers:
      - !Ref CommonLayer

# ─── Recursos ──────────────────────────────────────────────────────────────────
Resources:
# ── S3 Bucket para Imágenes ────────────────────────────────────────────────
  ImagesBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "${AWS::StackName}-images-${AWS::AccountId}"
      PublicAccessBlockConfiguration:
        BlockPublicAcls: false
        BlockPublicPolicy: false
        IgnorePublicAcls: false
        RestrictPublicBuckets: false
      CorsConfiguration:
        CorsRules:
          - AllowedHeaders: ["*"]
            AllowedMethods: ["GET", "PUT", "POST"]
            AllowedOrigins: ["*"] # En producción, limita esto a tu dominio
  # ── Política para permitir lectura pública (ReadOnly) ──────────────────────
  ImagesBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref ImagesBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: PublicReadGetObject
            Effect: Allow
            Principal: "*" # Permite a cualquier persona
            Action: "s3:GetObject"
            Resource: !Sub "arn:aws:s3:::${ImagesBucket}/*" # Aplica a todos los objetos dentro
  # ── Lambda: Image Management ──────────────────────────────────────────────
  ImagesFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: images-manager
      CodeUri: functions/ImagesManager/
      Handler: handler.lambda_handler
      Description: "Genera URLs para subir y gestionar imágenes en S3"
      Environment:
        Variables:
          BUCKET_NAME: !Ref ImagesBucket
      Policies:
        - S3WritePolicy:
            BucketName: !Ref ImagesBucket
        - S3ReadPolicy:
            BucketName: !Ref ImagesBucket
      Events:
        GetUploadUrl:
          Type: HttpApi
          Properties:
            ApiId: !Ref CitasApi
            Method: POST
            Path: /images/upload-url
        GetAudioUploadUrl:
          Type: HttpApi
          Properties:
            ApiId: !Ref CitasApi
            Method: POST
            Path: /audio/upload-url
        GetHomeMascotImages:
          Type: HttpApi
          Properties:
            ApiId: !Ref CitasApi
            Method: GET
            Path: /images/home-mascot-images
  # ── Capa compartida (utils.py) ─────────────────────────────────────────────
  CommonLayer:
    Type: AWS::Serverless::LayerVersion
    Properties:
      LayerName: citas-common
      ContentUri: layers/baselayer/
      CompatibleRuntimes:
        - python3.13
      RetentionPolicy: Delete

  # ── API Gateway HTTP API ───────────────────────────────────────────────────
  CitasApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      CorsConfiguration:
        AllowOrigins:
          - "*"
        AllowMethods:
          - GET
          - POST
          - PUT
          - DELETE
          - PATCH
          - OPTIONS
        AllowHeaders:
          - Content-Type
          - X-Api-Key

  # ── Lambda: Planes CRUD ────────────────────────────────────────────────────
  PlanesFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: planes-crud
      CodeUri: functions/DatesCRUD/
      Handler: handler.lambda_handler
      Description: "CRUD de Planes turísticos/actividades"
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref PlanesTableName
      Events:
        GetAll:
          Type: HttpApi
          Properties:
            ApiId: !Ref CitasApi
            Method: GET
            Path: /planes
        GetOne:
          Type: HttpApi
          Properties:
            ApiId: !Ref CitasApi
            Method: GET
            Path: /planes/{nombre}
        Create:
          Type: HttpApi
          Properties:
            ApiId: !Ref CitasApi
            Method: POST
            Path: /planes
        Update:
          Type: HttpApi
          Properties:
            ApiId: !Ref CitasApi
            Method: PUT
            Path: /planes/{nombre}
        Delete:
          Type: HttpApi
          Properties:
            ApiId: !Ref CitasApi
            Method: DELETE
            Path: /planes/{nombre}
        ResetRatings:
          Type: HttpApi
          Properties:
            ApiId: !Ref CitasApi
            Method: PATCH
            Path: /planes/reset-ratings

  # ── Lambda: Citas CRUD ─────────────────────────────────────────────────────
  CitasFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: citas-crud
      CodeUri: functions/CitasCRUD/
      Handler: handler.lambda_handler
      Description: "CRUD de Citas (agenda de actividades)"
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref CitasTableName
      Events:
        GetAll:
          Type: HttpApi
          Properties:
            ApiId: !Ref CitasApi
            Method: GET
            Path: /citas
        GetOne:
          Type: HttpApi
          Properties:
            ApiId: !Ref CitasApi
            Method: GET
            Path: /citas/{id}
        Create:
          Type: HttpApi
          Properties:
            ApiId: !Ref CitasApi
            Method: POST
            Path: /citas
        Update:
          Type: HttpApi
          Properties:
            ApiId: !Ref CitasApi
            Method: PUT
            Path: /citas/{id}
        Delete:
          Type: HttpApi
          Properties:
            ApiId: !Ref CitasApi
            Method: DELETE
            Path: /citas/{id}
        Open:
          Type: HttpApi
          Properties:
            ApiId: !Ref CitasApi
            Method: PATCH
            Path: /citas/{id}/abrir
        GetCancionesSemana:
          Type: HttpApi
          Properties:
            ApiId: !Ref CitasApi
            Method: GET
            Path: /citas/cancion-semana
        GetCancionSemanaActual:
          Type: HttpApi
          Properties:
            ApiId: !Ref CitasApi
            Method: GET
            Path: /citas/cancion-semana/current
        CreateCancionSemana:
          Type: HttpApi
          Properties:
            ApiId: !Ref CitasApi
            Method: POST
            Path: /citas/cancion-semana

  # ── Lambda: Random Plan ────────────────────────────────────────────────────
  RandomPlanFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: random-plan
      CodeUri: functions/RandomDates/
      Handler: handler.lambda_handler
      Description: "Genera un Plan aleatorio y una Cita sugerida"
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref PlanesTableName
        - DynamoDBCrudPolicy:
            TableName: !Ref CitasTableName
      Events:
        GetRandom:
          Type: HttpApi
          Properties:
            ApiId: !Ref CitasApi
            Method: POST
            Path: /planes/_random

  # ── Lambda: Love Phrases CRUD ──────────────────────────────────────────────
  LovePhrasesFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: love-phrases-crud
      CodeUri: functions/PhrasesCRUD/
      Handler: handler.lambda_handler
      Description: "CRUD de Frases de Amor para el juego del ahorcado"
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref LovePhrasesTable
      Events:
        GetAll:
          Type: HttpApi
          Properties:
            ApiId: !Ref CitasApi
            Method: GET
            Path: /love-phrases
        GetRandom:
          Type: HttpApi
          Properties:
            ApiId: !Ref CitasApi
            Method: GET
            Path: /love-phrases/random
        GetOne:
          Type: HttpApi
          Properties:
            ApiId: !Ref CitasApi
            Method: GET
            Path: /love-phrases/{id}
        Create:
          Type: HttpApi
          Properties:
            ApiId: !Ref CitasApi
            Method: POST
            Path: /love-phrases
        Update:
          Type: HttpApi
          Properties:
            ApiId: !Ref CitasApi
            Method: PUT
            Path: /love-phrases/{id}
        Delete:
          Type: HttpApi
          Properties:
            ApiId: !Ref CitasApi
            Method: DELETE
            Path: /love-phrases/{id}

  # ── Lambda: Bodas CRUD ────────────────────────────────────────────────────
  BodasFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: bodas-crud
      CodeUri: functions/BodasCRUD/
      Handler: handler.lambda_handler
      Description: "CRUD de bodas, invitados, itinerario y logística"
      Environment:
        Variables:
          BUCKET_NAME: !Ref ImagesBucket
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref BodasTable
        - S3WritePolicy:
            BucketName: !Ref ImagesBucket
        - S3ReadPolicy:
            BucketName: !Ref ImagesBucket
      Events:
        ListBodas:
          Type: HttpApi
          Properties:
            ApiId: !Ref CitasApi
            Method: GET
            Path: /bodas
        CreateBoda:
          Type: HttpApi
          Properties:
            ApiId: !Ref CitasApi
            Method: POST
            Path: /bodas
        GetBoda:
          Type: HttpApi
          Properties:
            ApiId: !Ref CitasApi
            Method: GET
            Path: /bodas/{bodaId}
        UpdateBoda:
          Type: HttpApi
          Properties:
            ApiId: !Ref CitasApi
            Method: PUT
            Path: /bodas/{bodaId}
        DeleteBoda:
          Type: HttpApi
          Properties:
            ApiId: !Ref CitasApi
            Method: DELETE
            Path: /bodas/{bodaId}
        PublicBoda:
          Type: HttpApi
          Properties:
            ApiId: !Ref CitasApi
            Method: GET
            Path: /bodas/{bodaId}/public
        ListCollection:
          Type: HttpApi
          Properties:
            ApiId: !Ref CitasApi
            Method: GET
            Path: /bodas/{bodaId}/{collection}
        CreateCollection:
          Type: HttpApi
          Properties:
            ApiId: !Ref CitasApi
            Method: POST
            Path: /bodas/{bodaId}/{collection}
        CreateAlbumUploadUrl:
          Type: HttpApi
          Properties:
            ApiId: !Ref CitasApi
            Method: POST
            Path: /bodas/{bodaId}/{collection}/upload-url
        GetCollectionItem:
          Type: HttpApi
          Properties:
            ApiId: !Ref CitasApi
            Method: GET
            Path: /bodas/{bodaId}/{collection}/{itemId}
        UpdateCollectionItem:
          Type: HttpApi
          Properties:
            ApiId: !Ref CitasApi
            Method: PUT
            Path: /bodas/{bodaId}/{collection}/{itemId}
        DeleteCollectionItem:
          Type: HttpApi
          Properties:
            ApiId: !Ref CitasApi
            Method: DELETE
            Path: /bodas/{bodaId}/{collection}/{itemId}
        UpdateInvitadoRsvp:
          Type: HttpApi
          Properties:
            ApiId: !Ref CitasApi
            Method: PATCH
            Path: /bodas/{bodaId}/invitados/{itemId}/rsvp

  # ── DynamoDB: Tabla Love Phrases ───────────────────────────────────────────
  LovePhrasesTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: LovePhrases
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
        - AttributeName: type
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH
      # GSI para filtrar por tipo (cancion, pelicula, libro, serie, pareja)
      GlobalSecondaryIndexes:
        - IndexName: type-index
          KeySchema:
            - AttributeName: type
              KeyType: HASH
          Projection:
            ProjectionType: ALL
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      SSESpecification:
        SSEEnabled: true
      Tags:
        - Key: Project
          Value: citas-app

  # ── Lambda: Kamasutra CRUD ─────────────────────────────────────────────────
  KamasutraFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: kamasutra-crud
      CodeUri: functions/KamasutraCRUD/
      Handler: handler.lambda_handler
      Description: "CRUD de posiciones de Kamasutra con niveles"
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref KamasutraTable
      Events:
        GetAll:
          Type: HttpApi
          Properties:
            ApiId: !Ref CitasApi
            Method: GET
            Path: /kamasutra
        GetRandom:
          Type: HttpApi
          Properties:
            ApiId: !Ref CitasApi
            Method: GET
            Path: /kamasutra/random
        GetOne:
          Type: HttpApi
          Properties:
            ApiId: !Ref CitasApi
            Method: GET
            Path: /kamasutra/{id}
        Create:
          Type: HttpApi
          Properties:
            ApiId: !Ref CitasApi
            Method: POST
            Path: /kamasutra
        Update:
          Type: HttpApi
          Properties:
            ApiId: !Ref CitasApi
            Method: PUT
            Path: /kamasutra/{id}
        Delete:
          Type: HttpApi
          Properties:
            ApiId: !Ref CitasApi
            Method: DELETE
            Path: /kamasutra/{id}

  # ── Lambda: Challenges CRUD ──────────────────────────────────────────────
  ChallengesFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: challenges-crud
      CodeUri: functions/ChallengesCRUD/
      Handler: handler.lambda_handler
      Description: "CRUD de Retos/Challenges con niveles (suave, picante, atrevido)"
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref ChallengesTable
      Events:
        GetAll:
          Type: HttpApi
          Properties:
            ApiId: !Ref CitasApi
            Method: GET
            Path: /challenges
        GetRandom:
          Type: HttpApi
          Properties:
            ApiId: !Ref CitasApi
            Method: GET
            Path: /challenges/random
        GetOne:
          Type: HttpApi
          Properties:
            ApiId: !Ref CitasApi
            Method: GET
            Path: /challenges/{id}
        Create:
          Type: HttpApi
          Properties:
            ApiId: !Ref CitasApi
            Method: POST
            Path: /challenges
        Update:
          Type: HttpApi
          Properties:
            ApiId: !Ref CitasApi
            Method: PUT
            Path: /challenges/{id}
        Delete:
          Type: HttpApi
          Properties:
            ApiId: !Ref CitasApi
            Method: DELETE
            Path: /challenges/{id}

  # ── Lambda: Dice CRUD (Acciones, Zonas, Modificadores) ──────────────────────
  DiceFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: dice-crud
      CodeUri: functions/DiceCRUD/
      Handler: handler.lambda_handler
      Description: "CRUD de Dados (acciones, zonas, modificadores) con niveles"
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref DiceTable
      Events:
        GetAll:
          Type: HttpApi
          Properties:
            ApiId: !Ref CitasApi
            Method: GET
            Path: /dice
        GetRandom:
          Type: HttpApi
          Properties:
            ApiId: !Ref CitasApi
            Method: GET
            Path: /dice/random
        GetOne:
          Type: HttpApi
          Properties:
            ApiId: !Ref CitasApi
            Method: GET
            Path: /dice/{id}
        Create:
          Type: HttpApi
          Properties:
            ApiId: !Ref CitasApi
            Method: POST
            Path: /dice
        Update:
          Type: HttpApi
          Properties:
            ApiId: !Ref CitasApi
            Method: PUT
            Path: /dice/{id}
        Delete:
          Type: HttpApi
          Properties:
            ApiId: !Ref CitasApi
            Method: DELETE
            Path: /dice/{id}

  # ── DynamoDB: Tabla Kamasutra ──────────────────────────────────────────────
  KamasutraTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: KamasutraTable
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
        - AttributeName: level
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH
      # GSI para filtrar eficientemente por nivel sin scan completo
      GlobalSecondaryIndexes:
        - IndexName: level-index
          KeySchema:
            - AttributeName: level
              KeyType: HASH
          Projection:
            ProjectionType: ALL
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      SSESpecification:
        SSEEnabled: true
      Tags:
        - Key: Project
          Value: citas-app

  # ── DynamoDB: Tabla Challenges ────────────────────────────────────────────
  ChallengesTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: ChallengesTable
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
        - AttributeName: level
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH
      # GSI para filtrar eficientemente por nivel sin scan completo
      GlobalSecondaryIndexes:
        - IndexName: level-index
          KeySchema:
            - AttributeName: level
              KeyType: HASH
          Projection:
            ProjectionType: ALL
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      SSESpecification:
        SSEEnabled: true
      Tags:
        - Key: Project
          Value: citas-app

  # ── DynamoDB: Tabla Dice ─────────────────────────────────────────────────
  DiceTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: DiceTable
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
        - AttributeName: level
          AttributeType: S
        - AttributeName: diceType
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH
      # GSI para filtrar por nivel
      GlobalSecondaryIndexes:
        - IndexName: level-index
          KeySchema:
            - AttributeName: level
              KeyType: HASH
          Projection:
            ProjectionType: ALL
        # GSI para filtrar por tipo de dado
        - IndexName: diceType-index
          KeySchema:
            - AttributeName: diceType
              KeyType: HASH
          Projection:
            ProjectionType: ALL
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      SSESpecification:
        SSEEnabled: true
      Tags:
        - Key: Project
          Value: citas-app

  # ── Lambda: Finances CRUD ─────────────────────────────────────────────────
  FinancesFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: finances-crud
      CodeUri: functions/FinancesCRUD/
      Handler: handler.lambda_handler
      Description: "CRUD de Finanzas de una Pareja con presupuestos y históricos"
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref FinancesTable
      Events:
        InitCouple:
          Type: HttpApi
          Properties:
            ApiId: !Ref CitasApi
            Method: POST
            Path: /finances/init
        GetCouple:
          Type: HttpApi
          Properties:
            ApiId: !Ref CitasApi
            Method: GET
            Path: /finances
        GetSummary:
          Type: HttpApi
          Properties:
            ApiId: !Ref CitasApi
            Method: GET
            Path: /finances/resumen
        ListExpenses:
          Type: HttpApi
          Properties:
            ApiId: !Ref CitasApi
            Method: GET
            Path: /finances/gastos
        CreateExpense:
          Type: HttpApi
          Properties:
            ApiId: !Ref CitasApi
            Method: POST
            Path: /finances/gastos
        GetExpense:
          Type: HttpApi
          Properties:
            ApiId: !Ref CitasApi
            Method: GET
            Path: /finances/gastos/{gastoId}
        UpdateExpense:
          Type: HttpApi
          Properties:
            ApiId: !Ref CitasApi
            Method: PUT
            Path: /finances/gastos/{gastoId}
        DeleteExpense:
          Type: HttpApi
          Properties:
            ApiId: !Ref CitasApi
            Method: DELETE
            Path: /finances/gastos/{gastoId}
        SetBudget:
          Type: HttpApi
          Properties:
            ApiId: !Ref CitasApi
            Method: POST
            Path: /finances/presupuesto/{monthYear}
        GetBudget:
          Type: HttpApi
          Properties:
            ApiId: !Ref CitasApi
            Method: GET
            Path: /finances/presupuesto/{monthYear}
        GetMonthlyHistory:
          Type: HttpApi
          Properties:
            ApiId: !Ref CitasApi
            Method: GET
            Path: /finances/historico/{monthYear}
        GetAllHistory:
          Type: HttpApi
          Properties:
            ApiId: !Ref CitasApi
            Method: GET
            Path: /finances/historico

  # ── Lambda: Checklists CRUD ────────────────────────────────────────────────
  ChecklistsFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: checklists-crud
      CodeUri: functions/ChecklistsCRUD/
      Handler: handler.lambda_handler
      Description: "CRUD de checklists (supermercado, viaje, deseos y personalizados) con grupos e items"
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref ChecklistsTable
      Events:
        ListChecklists:
          Type: HttpApi
          Properties:
            ApiId: !Ref CitasApi
            Method: GET
            Path: /checklists
        CreateChecklist:
          Type: HttpApi
          Properties:
            ApiId: !Ref CitasApi
            Method: POST
            Path: /checklists
        SeedDefaultChecklists:
          Type: HttpApi
          Properties:
            ApiId: !Ref CitasApi
            Method: POST
            Path: /checklists/seed-defaults
        GetChecklist:
          Type: HttpApi
          Properties:
            ApiId: !Ref CitasApi
            Method: GET
            Path: /checklists/{checklistId}
        UpdateChecklist:
          Type: HttpApi
          Properties:
            ApiId: !Ref CitasApi
            Method: PUT
            Path: /checklists/{checklistId}
        DeleteChecklist:
          Type: HttpApi
          Properties:
            ApiId: !Ref CitasApi
            Method: DELETE
            Path: /checklists/{checklistId}
        ResetChecklist:
          Type: HttpApi
          Properties:
            ApiId: !Ref CitasApi
            Method: PATCH
            Path: /checklists/{checklistId}/reset
        ListCollection:
          Type: HttpApi
          Properties:
            ApiId: !Ref CitasApi
            Method: GET
            Path: /checklists/{checklistId}/{collection}
        CreateCollectionItem:
          Type: HttpApi
          Properties:
            ApiId: !Ref CitasApi
            Method: POST
            Path: /checklists/{checklistId}/{collection}
        GetCollectionItem:
          Type: HttpApi
          Properties:
            ApiId: !Ref CitasApi
            Method: GET
            Path: /checklists/{checklistId}/{collection}/{itemId}
        UpdateCollectionItem:
          Type: HttpApi
          Properties:
            ApiId: !Ref CitasApi
            Method: PUT
            Path: /checklists/{checklistId}/{collection}/{itemId}
        DeleteCollectionItem:
          Type: HttpApi
          Properties:
            ApiId: !Ref CitasApi
            Method: DELETE
            Path: /checklists/{checklistId}/{collection}/{itemId}
        UpdateItemComprado:
          Type: HttpApi
          Properties:
            ApiId: !Ref CitasApi
            Method: PATCH
            Path: /checklists/{checklistId}/items/{itemId}/comprado

  # ── Lambda: Spotify API (catalogo y recomendaciones por busqueda) ─────────
  SpotifyFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: spotify-api
      CodeUri: functions/SpotifyAPI/
      Handler: handler.lambda_handler
      Description: "Endpoints GET de Spotify para busqueda y recomendaciones"
      Environment:
        Variables:
          SPOTIFY_CLIENT_ID: !Ref SpotifyClientId
          SPOTIFY_CLIENT_SECRET: !Ref SpotifyClientSecret
          SPOTIFY_MARKET: !Ref SpotifyMarket
      Events:
        SpotifySearch:
          Type: HttpApi
          Properties:
            ApiId: !Ref CitasApi
            Method: GET
            Path: /spotify/search
        SpotifyRecommendations:
          Type: HttpApi
          Properties:
            ApiId: !Ref CitasApi
            Method: GET
            Path: /spotify/recommendations
        SpotifyMoods:
          Type: HttpApi
          Properties:
            ApiId: !Ref CitasApi
            Method: GET
            Path: /spotify/moods
        SpotifyGenres:
          Type: HttpApi
          Properties:
            ApiId: !Ref CitasApi
            Method: GET
            Path: /spotify/genres
        SpotifyGetTrack:
          Type: HttpApi
          Properties:
            ApiId: !Ref CitasApi
            Method: GET
            Path: /spotify/tracks/{id}
        SpotifyGetArtist:
          Type: HttpApi
          Properties:
            ApiId: !Ref CitasApi
            Method: GET
            Path: /spotify/artists/{id}
        SpotifyGetArtistTopTracks:
          Type: HttpApi
          Properties:
            ApiId: !Ref CitasApi
            Method: GET
            Path: /spotify/artists/{id}/top-tracks

  # ── DynamoDB: Tabla Bodas (agregado completo) ────────────────────────────
  BodasTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: BodasTable
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
        - AttributeName: sk
          AttributeType: S
        - AttributeName: entityType
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
        - AttributeName: sk
          KeyType: RANGE
      GlobalSecondaryIndexes:
        - IndexName: entityType-index
          KeySchema:
            - AttributeName: entityType
              KeyType: HASH
            - AttributeName: sk
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      SSESpecification:
        SSEEnabled: true
      Tags:
        - Key: Project
          Value: citas-app

  # ── DynamoDB: Tabla Finances (PK/SK compuesta) ─────────────────────────────
  FinancesTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: FinancesTable
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
        - AttributeName: SK
          AttributeType: S
        - AttributeName: monthYear
          AttributeType: S
        - AttributeName: category
          AttributeType: S
      KeySchema:
        - AttributeName: PK
          KeyType: HASH
        - AttributeName: SK
          KeyType: RANGE
      # GSI para búsquedas por mes (análisis histórico)
      GlobalSecondaryIndexes:
        - IndexName: monthYear-index
          KeySchema:
            - AttributeName: PK
              KeyType: HASH
            - AttributeName: monthYear
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
        # GSI para búsquedas por categoría
        - IndexName: category-index
          KeySchema:
            - AttributeName: PK
              KeyType: HASH
            - AttributeName: category
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      SSESpecification:
        SSEEnabled: true
      Tags:
        - Key: Project
          Value: citas-app

  # ── DynamoDB: Tabla Checklists (agregado completo) ───────────────────────
  ChecklistsTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: ChecklistsTable
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
        - AttributeName: sk
          AttributeType: S
        - AttributeName: entityType
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
        - AttributeName: sk
          KeyType: RANGE
      GlobalSecondaryIndexes:
        - IndexName: entityType-index
          KeySchema:
            - AttributeName: entityType
              KeyType: HASH
            - AttributeName: sk
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      SSESpecification:
        SSEEnabled: true
      Tags:
        - Key: Project
          Value: citas-app

